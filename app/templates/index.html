<!DOCTYPE html>
<html>
<head>
    <title>ATEIA Chat</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        #chat {
            width: 60%;
            margin: auto;
            margin-top: 50px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            height: 500px;
            overflow-y: scroll;
        }

        .user {
            text-align: right;
            margin: 10px;
            color: blue;
        }

        .bot {
            text-align: left;
            margin: 10px;
            color: green;
        }

        #inputBox {
            width: 60%;
            margin: auto;
            display: flex;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px;
        }
    </style>
</head>
<body>

<div id="chat"></div>

<div id="inputBox">
    <input type="text" id="message" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>

document.getElementById("message").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});

let sessionId = null;

async function initSession() {
    sessionId = localStorage.getItem("session_id");

    if (!sessionId) {
        let res = await fetch("/create_session", {
            method: "POST"
        });

        let data = await res.json();

        sessionId = data.session_id;
        localStorage.setItem("session_id", sessionId);
    }
}

initSession();  

async function sendMessage() {
    let msg = document.getElementById("message").value;

    if (!msg) return;

    if (!sessionId) {
        alert("Session not ready. Refresh.");
        return;
    }

    let chat = document.getElementById("chat");

    chat.innerHTML += `<div class="user">${msg}</div>`;

    document.getElementById("message").value = "";

    let response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: msg,
            session_id: parseInt(sessionId) // 🔥 important
        })
    });

    let data = await response.json();

    let formattedReply = data.reply.replace(/\n/g, "<br>");

    chat.innerHTML += `<div class="bot">${formattedReply}</div>`;

    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
